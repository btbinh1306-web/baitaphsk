<!doctype html><html lang="vi"><meta charset="utf-8"><title>Kiểm tra nghe một lượt</title>
<p>Chỉ dùng để kiểm tra trên Vite dev server. File im lặng 12 giây; không dùng MP3 của đề.</p>
<div id="root"></div><button id="seek">Thử tua về đầu</button><button id="rate">Thử tốc độ 2×</button><p id="check" role="status"></p>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import SinglePassAudio from '../src/components/exercises/SinglePassAudio.tsx';
const bytes = new Uint8Array(44 + 8000 * 12 * 2);
const view = new DataView(bytes.buffer);
const text = (offset, value) => [...value].forEach((c, i) => bytes[offset + i] = c.charCodeAt(0));
text(0, 'RIFF'); view.setUint32(4, bytes.length - 8, true); text(8, 'WAVEfmt ');
view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
view.setUint32(24, 8000, true); view.setUint32(28, 16000, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
text(36, 'data'); view.setUint32(40, bytes.length - 44, true);
const src = URL.createObjectURL(new Blob([bytes], {type: 'audio/wav'}));
createRoot(document.getElementById('root')).render(React.createElement(SinglePassAudio, {src, audioKey: 'qa-single-pass-v1'}));
document.getElementById('seek').onclick = () => {
  const audio = document.querySelector('audio'); const before = audio.currentTime; audio.currentTime = 0;
  setTimeout(() => document.getElementById('check').textContent = audio.currentTime >= before - .5 ? 'PASS: tua bị chặn' : 'FAIL: tua về đầu', 300);
};
document.getElementById('rate').onclick = () => {
  const audio = document.querySelector('audio'); audio.playbackRate = 2;
  setTimeout(() => document.getElementById('check').textContent = audio.playbackRate === 1 ? 'PASS: tốc độ vẫn 1×' : 'FAIL: đổi tốc độ', 300);
};
</script></html>
